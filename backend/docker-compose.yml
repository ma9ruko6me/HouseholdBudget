services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: household_root
      MYSQL_DATABASE: household_budget
      MYSQL_USER: household
      MYSQL_PASSWORD: household
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-phousehold_root"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
